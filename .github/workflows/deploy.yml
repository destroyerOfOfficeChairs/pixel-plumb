name: Deploy Pixel Plumb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Caches ~/.cargo and target/. Without this every push is a cold
      # build of the whole dependency tree, which for Leptos is slow.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: jetli/trunk-action@v0.5.0
        with:
          version: "latest"

      # Trunk.toml and index.html live in webui/, so build from there.
      - name: Build
        working-directory: webui
        run: trunk build --release

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./webui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
